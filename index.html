<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naveen's Notes | PDF Library</title>
  <meta name="description" content="College study notes and downloadable PDF materials.">
  <style>
    :root { --blue:#2457d6; --bg:#f5f7fb; --text:#172033; --muted:#667085; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Arial, sans-serif; background:var(--bg); color:var(--text); }
    header { background:linear-gradient(135deg,#183c9e,#3975f6); color:white; padding:34px 18px; }
    .wrap { max-width:900px; margin:auto; }
    h1 { margin:0 0 8px; font-size:clamp(26px,5vw,38px); }
    header p { margin:0; opacity:.92; }
    main { padding:24px 18px 50px; }
    .search { width:100%; padding:14px 15px; border:1px solid #d5dbea; border-radius:12px; font-size:16px; margin-bottom:18px; }
    .hint { color:var(--muted); font-size:14px; margin:0 0 18px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; }
    .card { background:white; border:1px solid #e4e8f0; border-radius:14px; padding:18px; box-shadow:0 4px 14px #15274b0a; }
    .file { font-size:28px; }
    .card h2 { font-size:18px; margin:10px 0 6px; }
    .card p { color:var(--muted); line-height:1.45; min-height:40px; }
    .btn { display:inline-block; background:var(--blue); color:white; text-decoration:none; border-radius:9px; padding:10px 14px; font-weight:bold; }
    .empty { background:white; padding:22px; border-radius:12px; color:var(--muted); }
    footer { text-align:center; color:var(--muted); padding:20px; font-size:13px; }
  </style>
</head>
<body>
  <header><div class="wrap">
    <h1>📚 Naveen's Notes</h1>
    <p>College Notes &amp; PDF Library</p>
  </div></header>
  <main class="wrap">
    <input id="search" class="search" type="search" placeholder="Search notes (e.g. Python, DBMS)..." aria-label="Search notes">
    <p class="hint">Choose a subject and tap Open PDF to read or download the notes.</p>
    <section id="notes" class="grid" aria-live="polite"></section>
  </main>
  <footer>Study well • Share learning responsibly</footer>
<script>
  /*
    ADD YOUR PDF DETAILS HERE.
    1. Put the PDF file inside the "pdfs" folder.
    2. Add one item below, matching the file name exactly.
    3. Upload/commit the updated website to publish it.
  */
  const notes = [
    // Example:
    // { title: "Python Programming", subject: "Python", file: "pdfs/python-notes.pdf", description: "Python study notes" },
  ];

  const container = document.getElementById("notes");
  const search = document.getElementById("search");

  function renderNotes() {
    const query = search.value.trim().toLowerCase();
    const filtered = notes.filter(n =>
      [n.title, n.subject, n.description].join(" ").toLowerCase().includes(query)
    );
    if (!filtered.length) {
      container.innerHTML = '<div class="empty">No notes listed yet. Add your PDF files and update the notes list in <b>index.html</b>.</div>';
      return;
    }
    container.innerHTML = filtered.map(n => `
      <article class="card">
        <div class="file">📄</div>
        <h2>${escapeHTML(n.title)}</h2>
        <p>${escapeHTML(n.description || n.subject || "PDF study notes")}</p>
        <a class="btn" href="${encodeURI(n.file)}" target="_blank" rel="noopener">Open PDF ↗</a>
      </article>`).join("");
  }
  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[c]));
  }
  search.addEventListener("input", renderNotes);
  renderNotes();
</script>
</body>
</html>
